# アプリは 3 台で動かし、順番に振り分ける。DB は isu1 の MySQL に集約している。
upstream app {
  server 127.0.0.1:8080;       # isu1
  server 172.31.11.245:8080;   # isu2
  server 172.31.9.237:8080;    # isu3
}

server {
  listen 80 default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;
  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;

  # bot避けのためのvhostで、この証明書は自己署名です
  ssl_certificate     /etc/nginx/tls/dummy.crt;
  ssl_certificate_key /etc/nginx/tls/dummy.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl;
  server_name xiv.isucon.net;
  server_name *.xiv.isucon.net;

  ssl_certificate     /etc/nginx/tls/_.xiv.isucon.net.crt;
  ssl_certificate_key /etc/nginx/tls/_.xiv.isucon.net.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 10m;
  root /home/isucon/webapp/public/;
  location / {
    try_files $uri /index.html;
  }
  location /api/ {
    proxy_set_header Host $host;
    proxy_pass http://app;
  }

  # 通知と、通知の元になる状態を書き込む API は isu1 のアプリに寄せる。
  # 状態が変わったことを Go の channel で SSE の接続に知らせており、channel は同じプロセスの中でしか届かないため。

  # 通知は SSE で接続を張りっぱなしにするので、ためずにすぐ流し、無通信でも切らない
  location ~ ^/api/(app|chair)/notification$ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_pass http://127.0.0.1:8080;
  }

  # ライドの作成と評価、椅子の位置の送信、椅子によるライドの状態の更新
  location ~ ^/api/(app/rides|app/rides/[^/]+/evaluation|chair/coordinate|chair/rides/[^/]+/status)$ {
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:8080;
  }

  location /api/internal/ {
    # localhostからのみアクセスを許可
    allow 127.0.0.1;
    deny all;
    proxy_set_header Host $host;
    proxy_pass http://localhost:8080;
  }
}
